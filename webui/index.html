<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5f1" />
  <title>Bumblehive</title>
  <style>
    :root {
      --ink: #17181a;
      --muted: #868789;
      --soft-line: rgba(23, 24, 26, 0.09);
      --sidebar-width: clamp(300px, 20.38vw, 375px);
      --content-shift: -49px;
      --composer-bottom: clamp(58px, 10.95vh, 94px);
      --composer-height: 170px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-width: 760px;
      overflow: hidden;
      color: var(--ink);
      background: #e9e9e9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      position: relative;
      width: calc(100vw - 2px);
      height: calc(100vh - 2px);
      min-height: 620px;
      margin: 1px;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(24, 25, 27, 0.12);
      border-radius: 39px;
      background: #f8f6f2;
      box-shadow: 0 4px 18px rgba(37, 34, 28, 0.06);
    }

    .sidebar {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 47px 37px 31px 55px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.72);
      background:
        radial-gradient(ellipse 90% 43% at 9% 28%, rgba(255, 194, 20, 0.98) 0%, rgba(255, 200, 30, 0.78) 43%, rgba(255, 212, 63, 0) 100%),
        radial-gradient(ellipse 82% 40% at 8% 77%, rgba(255, 196, 20, 0.97) 0%, rgba(255, 207, 47, 0.76) 48%, rgba(255, 223, 101, 0) 100%),
        linear-gradient(90deg, #ffc421 0%, #ffd044 45%, #ffedb7 100%);
    }

    .sidebar::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 5% 46%, rgba(255, 210, 47, 0.3), transparent 28%),
        linear-gradient(90deg, transparent 54%, rgba(255, 255, 255, 0.26));
      mix-blend-mode: soft-light;
    }

    .brand,
    .nav,
    .recent,
    .sidebar-footer {
      position: relative;
      z-index: 1;
    }

    .brand {
      height: 39px;
      display: flex;
      align-items: center;
      font-size: 20px;
      font-weight: 640;
      letter-spacing: -0.025em;
      user-select: none;
    }

    .nav {
      margin-top: 42px;
      display: grid;
      gap: 24px;
    }

    .nav-button,
    .conversation,
    .settings-button,
    .suggestion,
    .tool-button,
    .workspace-button,
    .model-button,
    .send-button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav-button {
      width: 100%;
      min-height: 35px;
      padding: 0 11px 0 2px;
      display: flex;
      align-items: center;
      gap: 21px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 540;
      letter-spacing: -0.015em;
      text-align: left;
      transition: background 160ms ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.25);
    }

    .nav-icon {
      position: relative;
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
    }

    .plus-icon::before,
    .plus-icon::after {
      content: "";
      position: absolute;
      left: 1px;
      top: 10px;
      width: 21px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .plus-icon {
      position: relative;
      display: block;
    }

    .plus-icon::after {
      transform: rotate(90deg);
    }

    .search-icon {
      width: 20px;
      height: 20px;
      margin: 0 2px 3px 1px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      right: -5px;
      bottom: -3px;
      width: 8px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transform: rotate(47deg);
      transform-origin: left center;
    }

    .shortcut {
      margin-left: auto;
      color: rgba(23, 24, 26, 0.58);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .recent {
      margin-top: 62px;
    }

    .section-label {
      padding-left: 2px;
      color: rgba(23, 24, 26, 0.48);
      font-size: 13px;
      font-weight: 600;
    }

    .conversations {
      margin-top: 23px;
      display: grid;
      gap: 4px;
    }

    .conversation {
      position: relative;
      width: 100%;
      height: 48px;
      margin-left: 0;
      padding: 0 16px;
      overflow: hidden;
      border-radius: 15px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.012em;
      text-align: left;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: background 160ms ease;
    }

    .conversation:hover,
    .conversation:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.24);
    }

    .conversation.active {
      padding-left: 16px;
      background: rgba(255, 255, 255, 0.52);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.34),
        0 5px 15px rgba(78, 57, 10, 0.08);
    }

    .conversation.active::before {
      display: none;
    }

    .conversation.running {
      padding-left: 34px;
    }

    .conversation.running::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 50%;
      width: 7px;
      height: 7px;
      display: block;
      border-radius: 50%;
      background: #d89b0d;
      box-shadow: 0 0 0 4px rgba(216, 155, 13, 0.12);
      transform: translateY(-50%);
      animation: running-pulse 1.5s ease-in-out infinite;
    }

    @keyframes running-pulse {
      50% {
        opacity: 0.48;
        box-shadow: 0 0 0 7px rgba(216, 155, 13, 0.04);
      }
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 28px;
      border-top: 1px solid rgba(23, 24, 26, 0.09);
    }

    .settings-button {
      position: relative;
      width: 100%;
      height: 44px;
      padding: 0 2px;
      display: flex;
      align-items: center;
      gap: 17px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 540;
      text-align: left;
    }

    .settings-button:hover,
    .settings-button:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.22);
    }

    .gear {
      position: relative;
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      border: 2px solid currentColor;
      border-radius: 50%;
      box-shadow:
        0 -7px 0 -5px currentColor,
        0 7px 0 -5px currentColor,
        7px 0 0 -5px currentColor,
        -7px 0 0 -5px currentColor,
        5px 5px 0 -5px currentColor,
        -5px -5px 0 -5px currentColor,
        5px -5px 0 -5px currentColor,
        -5px 5px 0 -5px currentColor;
    }

    .gear::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .main-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 62% 80% at 28% 44%, rgba(255, 252, 246, 0.88), transparent 72%),
        radial-gradient(ellipse 46% 62% at 74% 47%, rgba(250, 247, 241, 0.6), transparent 74%),
        linear-gradient(115deg, #faf9f6 0%, #f7f5f1 57%, #f8f6f2 100%);
    }

    .main-panel.chat-active {
      --composer-bottom: 22px;
    }

    .main-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image: repeating-linear-gradient(0deg, rgba(25, 23, 20, 0.015) 0, rgba(25, 23, 20, 0.015) 1px, transparent 1px, transparent 3px);
    }

    .hero {
      position: absolute;
      z-index: 1;
      top: clamp(180px, 31.35vh, 268px);
      left: calc(50% + var(--content-shift));
      width: min(1000px, calc(100% - 120px));
      transform: translateX(-50%);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 2.62vw, 48px);
      line-height: 1.2;
      font-weight: 620;
      letter-spacing: -0.035em;
    }

    .suggestions {
      width: max-content;
      height: 66px;
      margin: 56px auto 0;
      padding: 0 15px;
      display: flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 34px;
      background: rgba(248, 245, 239, 0.74);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
    }

    .suggestion {
      position: relative;
      height: 43px;
      padding: 0 27px 0 18px;
      display: flex;
      align-items: center;
      gap: 17px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 520;
      letter-spacing: -0.02em;
      white-space: nowrap;
      transition: background 160ms ease, transform 160ms ease;
    }

    .suggestion + .suggestion {
      padding-left: 34px;
    }

    .suggestion + .suggestion::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 1px;
      height: 23px;
      background: rgba(23, 24, 26, 0.09);
    }

    .suggestion:last-child {
      padding-right: 20px;
    }

    .suggestion:hover,
    .suggestion:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.62);
      transform: translateY(-1px);
    }

    .suggest-icon {
      position: relative;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }

    .analysis-icon {
      border: 1.8px solid currentColor;
      border-radius: 7px;
    }

    .analysis-icon::before {
      content: "";
      position: absolute;
      left: 5px;
      bottom: 6px;
      width: 13px;
      height: 8px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: skewY(-42deg);
    }

    .analysis-icon::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -3px;
      width: 7px;
      height: 7px;
      border: 1.8px solid currentColor;
      border-radius: 2px;
      background: #f8f5ef;
    }

    .plan-icon::before,
    .plan-icon::after {
      content: "";
      position: absolute;
      left: 3px;
      width: 18px;
      height: 8px;
      border: 2px solid currentColor;
      border-radius: 8px;
    }

    .plan-icon::before {
      top: 3px;
    }

    .plan-icon::after {
      right: 2px;
      bottom: 2px;
      left: auto;
      width: 8px;
      border-radius: 50%;
    }

    .plan-icon .node {
      position: absolute;
      left: 4px;
      bottom: 2px;
      width: 7px;
      height: 7px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .code-icon {
      border: 1.8px solid currentColor;
      border-radius: 7px;
    }

    .code-icon::before {
      content: "</>";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 650 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -0.12em;
    }

    .composer {
      position: absolute;
      z-index: 1;
      left: calc(50% + var(--content-shift));
      bottom: var(--composer-bottom);
      width: min(1000px, calc(100% - 150px));
      height: var(--composer-height);
      transform: translateX(-50%);
      overflow: hidden;
      border: 1px solid rgba(25, 26, 28, 0.16);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow:
        0 18px 45px rgba(51, 46, 36, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      transition:
        bottom 220ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .composer:focus-within {
      border-color: rgba(23, 24, 26, 0.27);
      box-shadow:
        0 20px 52px rgba(51, 46, 36, 0.09),
        0 0 0 3px rgba(255, 197, 34, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    textarea {
      width: 100%;
      height: 98px;
      padding: 24px 26px 10px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 20px;
      line-height: 1.55;
      letter-spacing: -0.025em;
    }

    textarea::placeholder {
      color: #929396;
      opacity: 1;
    }

    .composer-toolbar {
      height: 72px;
      padding: 7px 18px 13px 24px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tool-button,
    .workspace-button,
    .model-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: background 160ms ease;
    }

    .tool-button:hover,
    .tool-button:focus-visible,
    .workspace-button:hover,
    .workspace-button:focus-visible,
    .model-button:hover,
    .model-button:focus-visible {
      outline: none;
      background: rgba(23, 24, 26, 0.055);
    }

    .tool-button {
      width: 34px;
      height: 40px;
      margin-right: 6px;
    }

    .tool-plus {
      width: 23px;
      height: 23px;
    }

    .workspace-button {
      height: 42px;
      padding: 0 9px;
      gap: 13px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .folder-icon {
      position: relative;
      width: 24px;
      height: 17px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
    }

    .folder-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 10px;
      height: 5px;
      border: 1.8px solid currentColor;
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .model-button {
      height: 42px;
      padding: 0 10px;
      gap: 15px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .chevron {
      width: 10px;
      height: 10px;
      margin: 0 4px 5px 2px;
      border-right: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      transform: rotate(45deg);
    }

    .send-button {
      position: relative;
      width: 58px;
      height: 58px;
      margin-left: 3px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 3px solid #fff;
      border-radius: 50%;
      color: #fff;
      background: #191a1c;
      box-shadow:
        0 0 0 1.5px #e6aa1f,
        0 5px 13px rgba(23, 24, 26, 0.16);
      transition: transform 160ms ease, background 160ms ease;
    }

    .send-button:hover,
    .send-button:focus-visible {
      outline: none;
      background: #292a2d;
      transform: translateY(-1px);
    }

    .send-arrow {
      position: relative;
      width: 18px;
      height: 24px;
    }

    .send-arrow::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 1px;
      width: 2px;
      height: 22px;
      border-radius: 2px;
      background: currentColor;
    }

    .send-arrow::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 2px;
      width: 10px;
      height: 10px;
      border-left: 2px solid currentColor;
      border-top: 2px solid currentColor;
      transform: rotate(45deg);
    }

    .stop-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: currentColor;
    }

    .toast {
      position: absolute;
      z-index: 4;
      left: calc(50% + var(--content-shift));
      bottom: 34px;
      padding: 10px 17px;
      border-radius: 20px;
      color: #fff;
      background: rgba(23, 24, 26, 0.9);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .confirm-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(31, 29, 25, 0.2);
      backdrop-filter: blur(8px);
    }

    .confirm-dialog {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid rgba(23, 24, 26, 0.1);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 70px rgba(28, 25, 20, 0.2);
    }

    .confirm-dialog h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .confirm-dialog p {
      margin: 12px 0 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .danger-button {
      min-width: 106px;
      height: 43px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: #b23b30;
      font: 650 14px/1 inherit;
      cursor: pointer;
    }

    .danger-button:not(:disabled):hover,
    .danger-button:not(:disabled):focus-visible {
      outline: none;
      background: #982f27;
      box-shadow: 0 5px 14px rgba(152, 47, 39, 0.2);
    }

    button:disabled {
      cursor: default;
    }

    .nav-button:disabled,
    .settings-button:disabled,
    .conversation:disabled {
      opacity: 0.56;
    }

    .session-search {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 42px;
      margin-top: 20px;
      padding: 0 15px;
      border: 1px solid rgba(23, 24, 26, 0.12);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.42);
      font: inherit;
      font-size: 15px;
    }

    .session-search:focus {
      border-color: rgba(23, 24, 26, 0.28);
      background: rgba(255, 255, 255, 0.58);
    }

    .recent {
      min-height: 0;
      overflow: hidden;
    }

    .conversations {
      max-height: calc(100vh - 390px);
      padding: 2px 4px 8px 0;
      grid-template-columns: minmax(0, 1fr);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(23, 24, 26, 0.18) transparent;
    }

    .conversation-row {
      position: relative;
      width: 100%;
      min-width: 0;
    }

    .conversation-row .conversation {
      padding-right: 42px;
    }

    .session-delete {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: 7px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      color: rgba(23, 24, 26, 0.55);
      background: transparent;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-50%);
      transition: opacity 140ms ease, background 140ms ease;
    }

    .conversation-row:hover .session-delete,
    .conversation-row:focus-within .session-delete,
    .session-delete:focus-visible {
      pointer-events: auto;
      opacity: 1;
    }

    .session-delete:hover,
    .session-delete:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.44);
    }

    .empty-sessions {
      padding: 20px 2px;
      color: rgba(23, 24, 26, 0.48);
      font-size: 14px;
    }

    .connection-state {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: calc(50% + var(--content-shift));
      width: min(520px, calc(100% - 100px));
      display: grid;
      justify-items: center;
      gap: 12px;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .connection-state h1 {
      font-size: 32px;
    }

    .connection-state p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 16px;
    }

    .connection-spinner {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
      border: 3px solid rgba(23, 24, 26, 0.12);
      border-top-color: #e6aa1f;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .chat-view {
      position: absolute;
      z-index: 1;
      inset: 0;
      padding: 48px max(70px, 7vw) 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(23, 24, 26, 0.18) transparent;
    }

    .message-list {
      width: min(920px, calc(100% - 30px));
      min-height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transform: translateX(var(--content-shift));
    }

    .message {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .message-user {
      width: fit-content;
      max-width: min(78%, 680px);
      align-self: flex-end;
    }

    .message-assistant,
    .message-tool {
      align-self: flex-start;
    }

    .assistant-iteration {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .execution-process {

    .message-assistant .message-content {

      font-size: 14px;
      line-height: 1.65;
    }

    }

    .message-assistant.message-error .message-content {

      border: 1px solid rgba(178, 59, 48, 0.16);

    .message-scroll-anchor {

    .markdown-body > :first-child {

    .markdown-body h3,

    }

      font-size: 1.22em;
    }

    .markdown-body h3,
    .markdown-body h4 {

    }

    .markdown-body blockquote {

      text-decoration: underline;
    }

    .markdown-body hr {

      border: 0;
      border-top: 1px solid rgba(23, 24, 26, 0.1);

      margin: 0.72em 0;

      font-weight: 650;

    .reasoning-block {
      width: 100%;
      padding: 0 4px;
      color: rgba(23, 24, 26, 0.58);
    }

    .reasoning-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -4px 0 -4px -5px;
      padding: 4px 7px 4px 5px;
      border: 0;
      border-radius: 11px;
      color: rgba(23, 24, 26, 0.56);
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .reasoning-toggle:hover,
    .reasoning-toggle:focus-visible {
      outline: none;
      color: rgba(23, 24, 26, 0.82);
    }

    .reasoning-status {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(23, 24, 26, 0.16);
      border-top-color: rgba(23, 24, 26, 0.62);
      border-radius: 50%;

    }

    .reasoning-block:not(.active) .reasoning-status {
      border: 2px solid rgba(23, 24, 26, 0.28);
    }

    .reasoning-chevron {
      width: 7px;
      height: 7px;
      margin: -3px 0 0 2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 140ms ease;
    }

    .reasoning-chevron.open {
      margin-top: 3px;
      transform: rotate(225deg);
    }

    .reasoning-content {
      margin: 8px 0 2px 20px;
      padding-left: 12px;
      border-left: 2px solid rgba(23, 24, 26, 0.08);
      color: rgba(23, 24, 26, 0.58);
      font-size: 14px;
      line-height: 1.62;
    }

    .tool-steps {
      width: 100%;
      padding: 0 4px;
      display: grid;
      gap: 6px;

    .tool-step {
      min-width: 0;

      gap: 8px;
      color: rgba(23, 24, 26, 0.54);
      font-size: 13.5px;
      line-height: 1.45;
    }

      background: #5f8f66;
      font-size: 10px;
      font-weight: 700;

      animation: spin 850ms linear infinite;
    }

      background: rgba(23, 24, 26, 0.42);

      font-weight: 560;

      font-weight: 520;

      gap: 5px;

      border-radius: 50%;
      background: rgba(23, 24, 26, 0.5);
      animation: typing 1s ease-in-out infinite;
    }

    .typing-dots i:nth-child(2) {
      animation-delay: 120ms;
    }

    .typing-dots i:nth-child(3) {
      animation-delay: 240ms;

    @keyframes typing {

        transform: translateY(-4px);
        opacity: 0.42;
      }

      overflow-y: auto;
    }

      margin: 0 auto;
      padding: 36px 40px 32px;
      border: 1px solid rgba(23, 24, 26, 0.1);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 70px rgba(51, 46, 36, 0.07);
      backdrop-filter: blur(18px);
      transform: translateX(var(--content-shift));

      display: flex;
      align-items: flex-start;

      border-radius: 12px;
      color: var(--ink);
      background: rgba(23, 24, 26, 0.04);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .primary-button,

      height: 43px;

      border-radius: 13px;
      font: 650 14px/1 inherit;
      cursor: pointer;
    }

    .primary-button {
      color: #fff;
      background: #191a1c;
    }

    .primary-button:disabled {
      opacity: 0.55;
    }

    .secondary-button {
      color: var(--ink);

    }

    .composer textarea:disabled {

      text-overflow: ellipsis;
      white-space: nowrap;
    }

      transform: none;
    }

    button:not(:disabled) {
      transform-origin: center;
      transition-property: transform, background-color, color, border-color,
        box-shadow, opacity;
      transition-duration: 190ms;
      transition-timing-function: cubic-bezier(0.22, 0.7, 0.25, 1);
      will-change: transform;
    }

    button:not(:disabled):active {
      transform: translateY(0.5px) scale(0.995);
      transition-duration: 90ms;
      transition-timing-function: cubic-bezier(0.2, 0.65, 0.3, 1);

      .composer {

        height: var(--composer-height);
