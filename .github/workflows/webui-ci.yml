name: WebUI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install WebUI dependencies
        run: pnpm --filter bumblehive-webui... install --frozen-lockfile

      - name: Test WebUI
        run: pnpm --filter bumblehive-webui run test

      - name: Build WebUI
        run: pnpm --filter bumblehive-webui run build
