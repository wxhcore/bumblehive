name: Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum, Python 3.11
            os: ubuntu-latest
            python-version: "3.11"
          - name: latest, Python 3.14
            os: ubuntu-latest
            python-version: "3.14"
          - name: Windows, Python 3.14
            os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            server/pyproject.toml

      - name: Install BumbleHive SDK
        run: python -m pip install -e .

      - name: Install BumbleHive Server
        run: python -m pip install -e "server[test]"

      - name: Run Server tests
        run: >-
          python -m pytest server/tests
          --durations=25
          --durations-min=1.0
