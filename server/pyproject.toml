[project]
name = "bumblehive-server"
version = "0.1.0"
description = "FastAPI server for the Bumblehive Python SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.21.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
]

[project.scripts]
bumblehive-server = "bumblehive_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bumblehive_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
