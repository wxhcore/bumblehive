[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bumblehive"
version = "0.1.1"
description = "An agent runtime designed for tool-driven loop engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "wxhcore" },
]
keywords = [
    "ai",
    "agent",
    "agent-loop",
    "llm",
    "mcp",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "openai>=2.0,<3.0",
    "fastmcp>=3.0,<4.0",
    "mcp>=1.26,<2.0",
    "jsonschema>=4.0,<5.0",
    "PyYAML>=6.0,<7.0",
    "PyMuPDF>=1.25,<2.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "rich>=14.0,<16.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
]
docs = [
    "jieba>=0.42,<1",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1,<2",
]

[project.urls]
Homepage = "https://github.com/wxhcore/bumblehive"
Repository = "https://github.com/wxhcore/bumblehive"
Issues = "https://github.com/wxhcore/bumblehive/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bumblehive"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bumblehive",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
