INHERIT: mkdocs.base.yml

docs_dir: docs/zh
site_dir: site
site_url: https://wxhcore.github.io/bumblehive/
edit_uri: edit/main/docs/zh/

theme:
  language: zh
  logo: assets/brand/bumblehive-wordmark.png
  favicon: assets/brand/bumblehive-bee.png

extra_css:
  - stylesheets/extra.css

plugins:
  search:
    lang: zh
    jieba_dict_user: docs/zh/jieba-user-dict.txt

nav:
  - 开始使用:
      - 项目介绍: index.md
      - 快速开始: getting-started/installation.md
  - 基础使用:
      - 模型配置: how-to/configuration.md
      - 工具调用:
          - 定义和使用工具: getting-started/first-tool.md
          - 等待结果与后台执行: how-to/background-tools.md
      - 多轮对话与记忆: how-to/memory-and-sessions.md
      - 流式输出: how-to/streaming.md
      - 图片输入: how-to/images.md
  - Human in the Loop:
      - 审批: concepts/tool-safety.md
      - 引导与纠偏: how-to/steering.md
      - 主动追问: how-to/ask-user.md
  - 扩展能力:
      - 文件操作与命令执行: how-to/files-and-commands.md
      - MCP: how-to/mcp.md
      - Skills: how-to/skills.md
      - 提示词与上下文: how-to/context.md
      - Hooks 与运行记录: how-to/hooks.md
      - 子 Agent 协作: examples/sub-agents.md
  - 完整示例:
      - 文件助手: examples/file-assistant.md
      - 交互式聊天助手: examples/chat-interface.md
  - API 参考:
      - Runtime 与运行结果: reference/runtime.md
      - 配置与模型 Provider: reference/config.md
      - AgentLoop 与 Runner: reference/agent.md
      - 工具与审批: reference/tools.md
      - 消息与会话: reference/protocols.md
      - MCP 与 Skills: reference/skills.md
      - 事件与 Hooks: reference/observability.md
  - 开发指南:
      - 错误与排查: how-to/error-handling.md
      - 测试 Agent: how-to/testing-an-agent.md
      - 自定义 Provider 与底层组装: development/adding-a-provider.md
      - 参与开发: development/testing-and-release.md
